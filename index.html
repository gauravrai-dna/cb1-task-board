<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CB1 Medical Task Board</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: summary strip, add form, filterable task table */
:root{--bg:#f4f6f5;--panel:#fff;--fg:#313131;--mute:#7c908e;--line:#d4d8d7;--accent:#4b5e5c;--ok:#2f7d5b;--warn:#b26b00;--bad:#c0392b;
--display:"Josefin Sans",system-ui,sans-serif;--body:"Montserrat",system-ui,sans-serif;--mono:"Montserrat",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141918;--panel:#1d2423;--fg:#eceeed;--mute:#939e9e;--line:#323c3b;--accent:#9fb5b2;--ok:#4cc26b;--warn:#e3a33b;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141918;--panel:#1d2423;--fg:#eceeed;--mute:#939e9e;--line:#323c3b;--accent:#9fb5b2;--ok:#4cc26b;--warn:#e3a33b;--bad:#ff6b6b;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}h1,.stat b,th,button{font-family:var(--display)}
button{color:var(--bg)!important}button.ghost,.x{color:var(--accent)!important}
.wrap{max-width:1200px;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.logo{display:block;height:34px;width:auto;max-width:100%;color:#344641;flex:none}
header .div{width:1px;align-self:stretch;background:var(--line)}
:root[data-theme="dark"] .logo{color:var(--fg)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:var(--fg)}}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.04em;color:var(--accent);text-transform:uppercase;padding-top:4px}.sub{color:var(--mute);margin:4px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.stat.bad b{color:var(--bad)}
form,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
form{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
label{display:grid;gap:4px;font-size:12px;color:var(--mute);flex:1 1 140px}label.wide{flex:3 1 280px}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:700;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}td select,td input{font-size:13px;padding:4px 6px;width:100%}
.due{font-family:var(--mono);font-size:13px}.over{color:var(--bad);font-weight:600}
.pri{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.High{color:var(--bad)}.Medium{color:var(--warn)}.Low{color:var(--ok)}
select.pri{border:none;font-weight:600;color:#fff;width:auto;padding:4px 10px}select.pri.High{background:var(--bad)}select.pri.Medium{background:var(--warn)}select.pri.Low{background:var(--ok)}select.pri option{background:var(--panel);color:var(--fg)}
tr.done td{opacity:.55}.src{font-size:12px;color:var(--mute)}
.empty{padding:28px;text-align:center;color:var(--mute)}.msg{color:var(--mute);font-size:13px}
.x{background:none;border:none;color:var(--mute);padding:2px 6px}
label:has(.dnw){position:relative}.dnw{position:absolute;top:100%;left:0;margin-top:4px;display:flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}form{padding-bottom:30px;row-gap:30px}
.nodue{background:none!important;border:none;color:var(--mute)!important;font-family:var(--body);font-weight:500;font-size:11px;padding:2px 0;text-decoration:underline;cursor:pointer}.nd{font-size:11px;color:var(--mute);margin-top:2px}
textarea.desc{display:block;width:100%;margin-top:4px;font-size:12px;padding:4px 6px;border:1px dashed transparent;background:transparent;color:var(--mute);resize:vertical;min-height:26px;field-sizing:content}textarea.desc:placeholder-shown{height:26px;resize:none;overflow:hidden}textarea.desc:hover,textarea.desc:focus{border-color:var(--line);background:var(--bg);color:var(--fg)}
.cd{font-size:12px;color:var(--mute);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(20,25,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)}.mbox h3{margin:0 0 8px;font-family:var(--display);font-size:18px}.mbox p{margin:0 0 18px;color:var(--mute);font-size:14px;line-height:1.5}.mbtn{display:flex;justify-content:flex-end;gap:8px}button.danger{background:var(--bad);border-color:var(--bad);color:#fff!important}
#f{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;align-items:start}#f>label:nth-child(5){grid-column:1/3}#f>button{align-self:end;justify-self:start;margin-bottom:1px}#f label{min-width:0}#f textarea{min-height:38px}
@media (max-width:720px){#f{grid-template-columns:1fr 1fr}#f>label:first-child,#f>label:nth-child(5){grid-column:1/-1}}
.h2{font-family:var(--display);font-size:18px;margin:0 0 10px}
.pipe{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:color-mix(in srgb,var(--accent) 7%,var(--bg));border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}.col.over-col{outline:2px dashed var(--accent)}
.colh{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:grab;display:grid;gap:6px}.ct{font-weight:600;font-size:13px}
.cm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mute)}.cm .pri{font-size:11px;padding:0 6px}.mv{display:flex;justify-content:space-between}
.steps{margin-top:6px;font-size:13px}.steps summary{cursor:pointer;color:var(--mute);display:flex;align-items:center;gap:8px}
.pbar{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.steps ol{margin:8px 0;padding-left:20px;display:grid;gap:4px}.steps li{display:flex;align-items:center;gap:6px}.steps li span{flex:1}.steps li.sd span{text-decoration:line-through;color:var(--mute)}
.steps li input[type=date]{width:auto;font-size:12px;padding:2px 4px}.steps input[type=checkbox]{width:auto}.addstep{display:flex;gap:6px}.addstep input{flex:1}.addstep button{padding:4px 10px}
</style>
</head>

<div class="stats" id="stats"></div>
<h2 class="h2">Add a task</h2>
<form id="f">
<label class="wide">Task<input id="t" required placeholder="e.g. Renew SSL for cb1medical.com"></label>
<label>Area<input id="c" placeholder="Website, SEO, Ads…"></label>
<label>Assigned to<input id="a" placeholder="Name"></label>

<button>Add task</button>
</form>

<label>Filter by person<select id="fa"><option value="">Everyone</option></select></label>

<label class="wide">Search<input id="q" placeholder="Search tasks"></label>
<button class="ghost" id="csv" type="button">Export to Excel</button>
</div>

<script>
const ST=["To do","In progress","Done"];let tasks=[],db=null;const $=id=>document.getElementById(id);
const today=new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){if(typeof renderPipe==="function")renderPipe();
 const fa=$("fa").value,fs=$("fs").value,q=$("q").value.toLowerCase();
 const people=[...new Set(tasks.map(t=>t.assignee||"Unassigned"))].sort();
 $("fa").innerHTML='<option value="">Everyone</option>'+people.map(p=>`<option${p===fa?" selected":""}>${esc(p)}</option>`).join("");
 const open=tasks.filter(t=>t.status!=="Done");
 $("stats").innerHTML=[["Open",open.length],["Overdue",open.filter(t=>t.due&&t.due<today).length,"bad"],["Due today",open.filter(t=>t.due===today).length],["Unassigned",open.filter(t=>!t.assignee).length],["Done",tasks.length-open.length]].map(([l,n,c])=>`<div class="stat ${c||""}"><b>${n}</b><span>${l}</span></div>`).join("");
 let list=tasks.filter(t=>(!fa||(t.assignee||"Unassigned")===fa)&&(fs===""||(fs==="open"?t.status!=="Done":t.status===fs))&&(!q||(t.task+" "+t.client+" "+(t.desc||"")).toLowerCase().includes(q)));
 list.sort((a,b)=>(a.status==="Done")-(b.status==="Done")||(a.due||"9")<(b.due||"9")?-1:1);
 $("rows").innerHTML=list.length?list.map(t=>`<tr class="${t.status==="Done"?"done":""}" data-id="${t.id}">
 <td>${esc(t.task)}<textarea class="desc" data-k="desc" rows="1" placeholder="+ Add description">${esc(t.desc)}</textarea>${stepsHtml(t)}</td><td>${esc(t.client)}</td>
 <td><input data-k="assignee" value="${esc(t.assignee)}" placeholder="Unassigned"></td>
 <td><input type="date" data-k="due" value="${esc(t.due)}" class="due ${t.due&&t.due<today&&t.status!=="Done"?"over":""}">${t.due?"":`<div class="nd">No due date</div>`}</td>
 <td><select data-k="priority" class="pri ${esc(t.priority)}">${["High","Medium","Low"].map(p=>`<option${p===t.priority?" selected":""}>${p}</option>`).join("")}</select></td>
 <td><select data-k="status">${ST.map(s=>`<option${s===t.status?" selected":""}>${s}</option>`).join("")}</select></td>
 <td><button class="x" data-del title="Delete">✕</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">No tasks here yet. Add one above.</td></tr>`;
}
["fa","fs","q"].forEach(i=>$(i).addEventListener("input",render));
$("rows").addEventListener("change",async e=>{if(e.target.closest(".steps"))return;const k=e.target.dataset.k,id=e.target.closest("tr")?.dataset.id;if(!k||!db)return;
 try{await db.doc("tasks/"+id).update({[k]:e.target.value,updated:new Date().toISOString()});if(k==="priority")e.target.className="pri "+e.target.value}catch(err){$("msg").textContent="Couldn't save that change: "+(err.message||err.code)}});
$("rows").addEventListener("click",async e=>{if(!e.target.matches("[data-nodue]")||!db)return;const id=e.target.closest("tr").dataset.id;try{await db.doc("tasks/"+id).update({due:"",updated:new Date().toISOString()})}catch(err){$("msg").textContent="Couldn't save: "+(err.message||err.code)}});
function askDelete(id){const t=tasks.find(x=>x.id===id);return new Promise(res=>{const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Delete this task?</h3><p>"${esc(t?t.task:"")}" will be removed for everyone. This can't be undone.</p><div class="mbtn"><button type="button" class="ghost" data-c>Cancel</button><button type="button" class="danger" data-ok>Delete</button></div></div>`;
 const done=v=>{m.remove();document.removeEventListener("keydown",k);res(v)};const k=e=>{if(e.key==="Escape")done(false)};document.addEventListener("keydown",k);
 m.addEventListener("click",e=>{if(e.target===m||e.target.matches("[data-c]"))done(false);if(e.target.matches("[data-ok]"))done(true)});document.body.appendChild(m);m.querySelector("[data-c]").focus()})}
const pend=new Set();
$("rows").addEventListener("click",async e=>{if(!e.target.matches("[data-del]")||!db)return;const id=e.target.closest("tr").dataset.id;
 if(!await askDelete(id))return;
 try{await db.doc("tasks/"+id).delete()}catch(err){$("msg").textContent="Couldn't delete: "+(err.message||err.code)}});
$("f").addEventListener("submit",async e=>{e.preventDefault();
 const id="t"+Date.now().toString(36);
 try{await db.doc("tasks/"+id).set({task:$("t").value,client:$("c").value,assignee:$("a").value,due:$("d").value,priority:$("p").value,desc:$("ds").value.trim(),status:"To do",notes:"",created:new Date().toISOString()});$("t").value="";$("a").value="";$("d").value="";$("ds").value=""}
 catch(err){$("msg").textContent="Couldn't add task: "+(err.message||err.code)}});
$("csv").addEventListener("click",async()=>{ if(!window.XLSX){$("msg").textContent="Excel export is still loading. Try again in a moment.";return}
 const rows=tasks.slice().sort((a,b)=>ST.indexOf(a.status)-ST.indexOf(b.status)||((a.due||"9")<(b.due||"9")?-1:1)).map(t=>{const s=t.steps||[];return{"Task":t.task,"Description":t.desc||"","Area":t.client||"","Assigned to":t.assignee||"Unassigned","Due date":t.due||"No due date","Priority":t.priority,"Status":t.status,"Steps done":s.length?`${s.filter(x=>x.done).length}/${s.length}`:"","Steps":s.map(x=>(x.done?"✓ ":"☐ ")+x.text+(x.date?` (${x.date})`:"")).join("\n")}});
 const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[{wch:50},{wch:50},{wch:14},{wch:16},{wch:13},{wch:10},{wch:12},{wch:11},{wch:60}];ws["!autofilter"]={ref:ws["!ref"]};
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Tasks");
 const sum=[["Status","Count"],...ST.map(s=>[s,tasks.filter(t=>t.status===s).length]),["Overdue",tasks.filter(t=>t.status!=="Done"&&t.due&&t.due<today).length],["Exported",today]];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"Summary");
 XLSX.writeFile(wb,`CB1_Medical_Tasks_${today}.xlsx`)});
function renderPipe(){$("pipe").innerHTML=ST.map((s,si)=>{const l=tasks.filter(t=>t.status===s).sort((a,b)=>(a.due||"9")<(b.due||"9")?-1:1);
 return `<div class="col" data-col="${s}"><div class="colh"><span>${s}</span><b>${l.length}</b></div>${l.map(t=>{const st=t.steps||[],d=st.filter(x=>x.done).length;
 return `<div class="card" draggable="true" data-cid="${t.id}"><div class="ct">${esc(t.task)}</div>${t.desc?`<div class="cd">${esc(t.desc)}</div>`:""}<div class="cm"><span class="pri ${esc(t.priority)}">${esc(t.priority)}</span>${t.due?`<span class="${t.due<today&&s!=="Done"?"over":""}">${t.due.slice(8)}/${t.due.slice(5,7)}</span>`:`<span>No due date</span>`}<span>${esc(t.assignee||"Unassigned")}</span></div>${st.length?`<div class="cm"><span class="pbar"><i style="width:${d/st.length*100}%"></i></span>${d}/${st.length}</div>`:""}<div class="mv">${si>0?`<button class="x" data-mv="${si-1}" title="Move back">←</button>`:"<span></span>"}${si<ST.length-1?`<button class="x" data-mv="${si+1}" title="Move forward">→</button>`:""}</div></div>`}).join("")||'<div class="msg">Nothing here</div>'}</div>`}).join("")}
async function moveTo(id,s){if(!db)return;try{await db.doc("tasks/"+id).update({status:s,updated:new Date().toISOString()})}catch(err){$("msg").textContent="Couldn't move task: "+(err.message||err.code)}}
$("pipe").addEventListener("click",e=>{const b=e.target.closest("[data-mv]");if(b)moveTo(b.closest(".card").dataset.cid,ST[+b.dataset.mv])});
$("pipe").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(c)e.dataTransfer.setData("text/plain",c.dataset.cid)});
$("pipe").addEventListener("dragover",e=>{const c=e.target.closest(".col");if(c){e.preventDefault();c.classList.add("over-col")}});
$("pipe").addEventListener("dragleave",e=>{e.target.closest(".col")?.classList.remove("over-col")});
$("pipe").addEventListener("drop",e=>{const c=e.target.closest(".col");if(!c)return;e.preventDefault();c.classList.remove("over-col");const id=e.dataTransfer.getData("text/plain");if(id)moveTo(id,c.dataset.col)});
const openS=new Set();
function stepsHtml(t){const s=t.steps||[],d=s.filter(x=>x.done).length,pct=s.length?Math.round(d/s.length*100):0;
 return `<details class="steps" data-sid="${t.id}"${openS.has(t.id)?" open":""}><summary>${s.length?`<span class="pbar"><i style="width:${pct}%"></i></span> ${d}/${s.length} steps`:"Add steps"}</summary><ol>${s.map((x,i)=>`<li class="${x.done?"sd":""}"><input type="checkbox" data-step="${i}"${x.done?" checked":""} aria-label="Done"><span>${esc(x.text)}</span><input type="date" data-sdate="${i}" value="${esc(x.date)}" aria-label="Date"><button class="x" data-sdel="${i}" title="Remove step">✕</button></li>`).join("")}</ol><div class="addstep"><input placeholder="New step" data-snew><button type="button" class="ghost" data-sadd>Add</button></div></details>`}
document.addEventListener("toggle",e=>{const id=e.target.dataset?.sid;if(id)e.target.open?openS.add(id):openS.delete(id)},true);
async function saveSteps(id,steps){try{await db.doc("tasks/"+id).update({steps,updated:new Date().toISOString()})}catch(err){$("msg").textContent="Couldn't save step: "+(err.message||err.code)}}
$("rows").addEventListener("change",e=>{const el=e.target,tr=el.closest("tr");if(!tr||!db)return;const t=tasks.find(x=>x.id===tr.dataset.id);const s=[...(t.steps||[])].map(x=>({...x}));
 if(el.dataset.step!=null){const x=s[+el.dataset.step];x.done=el.checked;if(el.checked&&!x.date)x.date=today;saveSteps(t.id,s)}
 else if(el.dataset.sdate!=null){s[+el.dataset.sdate].date=el.value;saveSteps(t.id,s)}});
$("rows").addEventListener("click",e=>{const el=e.target,tr=el.closest("tr");if(!tr||!db)return;const t=tasks.find(x=>x.id===tr.dataset.id);const s=[...(t.steps||[])];
 if(el.matches("[data-sadd]")){const inp=el.previousElementSibling,v=inp.value.trim();if(!v)return;s.push({text:v,done:false,date:""});saveSteps(t.id,s)}
 if(el.dataset.sdel!=null){s.splice(+el.dataset.sdel,1);saveSteps(t.id,s)}});
$("rows").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-snew]")){e.preventDefault();e.target.nextElementSibling.click()}});
render();
// ---- Supabase backend ----
const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const chk=async p=>{const {error}=await p;if(error)throw error};
db={doc(path){const id=path.split("/")[1];return{
 set:d=>chk(sb.from("tasks").upsert({id,data:d})),
 update:d=>{const cur=tasks.find(t=>t.id===id)||{};const {id:_,...rest}=cur;const data={...rest,...d};const i=tasks.findIndex(t=>t.id===id);if(i>=0)tasks[i]={id,...data};return chk(sb.from("tasks").update({data}).eq("id",id))},
 delete:()=>chk(sb.from("tasks").delete().eq("id",id))}}};
async function load(){const {data,error}=await sb.from("tasks").select("id,data");
 if(error){$("msg").textContent="Couldn't load tasks: "+error.message;return}
 tasks=data.map(r=>({id:r.id,...r.data}));$("msg").textContent=tasks.length+" tasks";render()}
let lt;sb.channel("tasks").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>{clearTimeout(lt);lt=setTimeout(load,150)}).subscribe();
load();
</script>
